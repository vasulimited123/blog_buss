{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Something went wrong — Wellness Blog</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {# Standalone: a 500 means something failed, so we avoid base.html,
       context processors, and DB queries which might also fail. #}
    <main class="container" style="padding:60px 20px; text-align:center;">
        <h1>Something went wrong on our end</h1>
        <p>We've hit a temporary problem. Please try again in a moment.</p>
        <p><a href="/">← Back to home</a></p>
    </main>
</body>
</html>
